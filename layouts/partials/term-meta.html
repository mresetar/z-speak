{{ with .Params.expansion }}<p class="expansion">{{ . }}</p>{{ end }}
<div class="chips">
  {{ range .Params.categories }}<a class="chip chip-cat" href="{{ (print "categories/" (urlize .) "/") | relLangURL }}">{{ . }}</a>{{ end }}
  {{ range .Params.tags }}<a class="chip" href="{{ (print "tags/" (urlize .) "/") | relLangURL }}">#{{ . }}</a>{{ end }}
</div>
