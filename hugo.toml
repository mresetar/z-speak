# ZSpeak — The IBM Z Mainframe Glossary
# Build:  hugo            -> ./public
# Serve:  hugo server -D  -> http://localhost:1313

baseURL = "/"
locale = "en-us"
title = "ZSpeak"
enableGitInfo = true
enableRobotsTXT = true
capitalizeListTitles = false
summaryLength = 20

[params]
  subtitle = "The IBM Z Mainframe Glossary"
  description = "Short, accurate explanations of the terms you meet on IBM Z and z/OS."
  # Shown in the footer; set to your GitLab project URL.
  repo = ""
  edit_path = "content"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[outputs]
  home = ["html"]
  section = ["html"]

[build]
  [build.buildStats]
    enable = false

[frontmatter]
  date = ["date", ":gitinfo", ":fileModTime"]
  lastmod = ["lastmod", ":gitinfo", ":fileModTime"]
